[project]
name = "afe-env-autofeat"
version = "0"
requires-python = "==3.11.*"
dependencies = [
    "afe",
    "pytest",
    "autofeat==2.1.3",
    "numpy<2",
    "scikit-learn<1.8",  # autofeat 2.1.3 passes check_array(force_all_finite=...), removed in 1.8
]

[tool.uv]
package = false

[tool.uv.sources]
afe = { path = "../..", editable = true }

