[project]
name = "afe-env-openfe"
version = "0"
requires-python = "==3.11.*"
dependencies = [
    "afe",
    "pytest",
    "openfe==0.0.12",
    "matplotlib",  # imported by openfe, not declared
    "scikit-learn<1.6",  # openfe 0.0.12 calls mean_squared_error(squared=False), removed in 1.6
]

[tool.uv]
package = false

[tool.uv.sources]
afe = { path = "../..", editable = true }

