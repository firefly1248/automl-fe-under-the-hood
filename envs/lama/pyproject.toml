[project]
name = "afe-env-lama"
version = "0"
requires-python = "==3.11.*"
dependencies = [
    "afe",
    "pytest",
    "lightautoml==0.4.2",
    "torch",
    "numpy<2",  # statsmodels<=0.14.0 (lightautoml dep) is built for numpy 1
    "pandas<2",  # LAMA 0.4.2 OrdinalEncoder reads the wrong value_counts column under pandas 2 (categorical.py:1053)
    "scipy<1.16",  # statsmodels 0.14.0 imports scipy._lib._util._lazywhere, removed in scipy 1.16
]

[tool.uv]
package = false

[tool.uv.sources]
afe = { path = "../..", editable = true }
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# macOS: torch bundles its own libomp.dylib; lightgbm links the brew one. Two OpenMP runtimes
# in one process deadlock or segfault (seen in exp03 step 3 and would hit exp06 worker_lama).
# After uv sync, point torch at the brew copy:
#   cd .venv/lib/python3.11/site-packages/torch/lib
#   mv libomp.dylib libomp.dylib.orig && ln -s /opt/homebrew/opt/libomp/lib/libomp.dylib libomp.dylib
