[project]
name = "afe"
version = "0.1.0"
description = "Companion code for 'What automated feature engineering really does under the hood'"
requires-python = "==3.11.*"
dependencies = ["numpy", "pandas", "pyarrow", "psutil", "pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afe"]
