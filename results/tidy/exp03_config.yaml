      feature_group_size: 1
      max_features_cnt_in_result: null
      select_algos: [gbm]
    selection_mode_meaning: 'ImportanceCutoffSelector: LGBSimpleFeatures + LightGBM,
      gain importance, drop importance <= cutoff'
    gbm_pipeline_params:
      top_intersections: 4
      max_intersection_depth: 3
      subsample: 100000
      auto_unique_co: 10
      multiclass_te_co: 3
      output_categories: false
      use_groupby: false
      groupby_types: [delta_median, delta_mean, min, max, std, mode, is_mode]
      groupby_top_based_on: cardinality
      groupby_top_categorical: 3
      groupby_top_numerical: 3
      groupby_triplets: []
    linear_pipeline_params:
      top_intersections: 4
      max_intersection_depth: 3
      subsample: 100000
      auto_unique_co: 50
      multiclass_te_co: 3
      use_groupby: false
      groupby_types: [delta_median, delta_mean, min, max, std, mode, is_mode]
      groupby_top_based_on: cardinality
      groupby_top_categorical: 3
      groupby_top_numerical: 3
      groupby_triplets: []
    reader_params: {samples: 100000, max_nan_rate: 0.999, max_constant_rate: 0.999,
      cv: 5, random_state: 42, roles_params: null, n_jobs: 1, advanced_roles: true,
      numeric_unique_rate: 0.999, max_to_3rd_rate: 1.1, binning_enc_rate: 2, raw_decr_rate: 1.1,
      max_score_rate: 0.2, abs_score_val: 0.04, drop_score_co: 0.0}
